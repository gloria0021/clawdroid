<!doctype html>

<body>
<div id="hero"></div>

<div id="panel">
  <div class="note">上の帯がサイドパネルの看板の場所（試作）。見る専用でタッチは受けない。下はプレビューだけの操作盤（アプリには出さない）。</div>

  <div id="agents"></div>

</div>

<script type="module">
// SumahoClaw のバーチャルオフィス（spec 009）。アプリの assets/office に置き、WebView で見る専用に描く。
// 外へは通信しない（three.js も同梱）。アプリは window.office の口だけを使う。
// 同じファイルを tailnet のプレビューでも開ける（?embed を付けなければ下に操作盤が出る）
import * as THREE from './three.module.min.js';

/** 位置・法線・UV だけを持つ、索引の無い形どうしを 1 つにつなぐ。 */
function mergeGeometries(list) {
  let count = 0;
  for (const g of list) count += g.attributes.position.count;
  const out = new THREE.BufferGeometry();
  for (const name of ['position', 'normal', 'uv']) {
    const size = list[0].attributes[name].itemSize, arr = new Float32Array(count * size);
    let o = 0;
    for (const g of list) { arr.set(g.attributes[name].array, o); o += g.attributes[name].array.length; }
    out.setAttribute(name, new THREE.BufferAttribute(arr, size));
  }
  return out;
}

// ============================================================
// 色。家具の色はライト・ダークで共通（暗さは明かりで出す）
// ============================================================
const COLORS = {
  wall: '#ebe6dc', trim: '#cfc8ba', baseboard: '#8a7f70', beam: '#ddd6c9',
  windowFrame: '#4a4f58', sill: '#d8d2c6',
  deskTop: '#cfa97f', deskLeg: '#3d424a', partition: '#86a294', partitionTop: '#5c6a63',
  monitor: '#23262c', keyboard: '#dfe1e6', paper: '#fafafa', paper2: '#e9edf2',
  mugRed: '#e06a5a', mugWhite: '#f4f4f4', mugYellow: '#f0b23e', mugBlue: '#5b8fd6',
  chair: '#3f4655', chairBase: '#2c3038',
  shelf: '#a7835f', book1: '#c0504d', book2: '#4f81bd', book3: '#9bbb59', book4: '#f0b23e', book5: '#8064a2', book6: '#e8e2d4',
  cabinet: '#b8bcc4', handle: '#5a5f68',
  board: '#ffffff', clockRim: '#2b2f36', clockFace: '#fafafa', hand: '#2b2f36',
  counter: '#eae6de', counterTop: '#5a5f68', machine: '#2b2f36', steel: '#b9bec6',
  cooler: '#e8eef5', coolerWater: '#8fc1e8', printer: '#dfe1e6', printerDark: '#4a4f58',
  sofa: '#5b7fa6', sofaCushion: '#6f93ba', coffeeTable: '#8a6a4e', loungeRug: '#d9cbb5', magazine: '#e06a5a',
  lampBase: '#3d424a', lampShade: '#f3e6c8',
  bedFrame: '#b8916b', mattress: '#f4f1ea', pillow: '#ffffff', blanket: '#7f9cc9', nightstand: '#a7835f', napRug: '#cfc2d8',
  artFrame: '#2b2f36', art1: '#e9b44c', art2: '#4f81bd', art3: '#e06a5a', art4: '#86a294',
  potWhite: '#e6e1d8', potTerra: '#b86b3c', potDark: '#3a3f47', soil: '#4a3a2c', trunk: '#7a5a3c',
  leaf: '#4f8a4b', leaf2: '#3f7a3c', leaf3: '#6aa35a', leaf4: '#2f6b3a',
  glassFrame: '#9aa0a8',
};
const THEMES = {
  light: { hemiSky: '#ffffff', hemiGround: '#b8ad9a', hemi: 1.55, sun: 1.45, sunColor: '#fff4e2',
    screenOn: '#8fc1ff', screenOff: '#262a31', ink: '#2a2a33', accent: '#4c7bd9', bg: '#e6e0d5', night: false },
  // 夜のオフィス: 全体は青みの暗がり。デスクの島の上だけ暗めの蛍光灯、モニターの照り返し、仮眠室とラウンジは暖色
  dark: { hemiSky: '#8ea2cc', hemiGround: '#2c2f38', hemi: 0.85, sun: 0.22, sunColor: '#9fb4e0',
    screenOn: '#b9dcff', screenOff: '#1a1c21', ink: '#eef0f6', accent: '#9cb8ff', bg: '#3a3c44', night: true },
};
const PRESETS = [
  { skin: '#f1c7a5', hair: '#2b2421', shirt: '#4c7bd9', pants: '#3a3f4b' },
  { skin: '#e0b08a', hair: '#7a4a2a', shirt: '#e06a5a', pants: '#33363f' },
  { skin: '#f6d3b8', hair: '#e2c25a', shirt: '#4fae7a', pants: '#41454f' },
  { skin: '#c68b62', hair: '#1e1a18', shirt: '#f0b23e', pants: '#2f3440' },
];
let FPS = 60;              // 描く回数の上限（電池のため。試作で 30 / 60 / 上限なし を比べる）
const WALK_SPEED = 2.6;    // 1 秒に進むマス
const SEATS = 4;           // サイドパネルのエージェントは最大 4 体（MAX_SIDEBAR_AGENTS）

// 決まった乱数（開くたびに同じ部屋）
function rng(seed) { return () => { seed |= 0; seed = (seed + 0x6D2B79F5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }

// ============================================================
// 描画の土台
// ============================================================
const hero = document.getElementById('hero');
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'low-power' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFShadowMap;
hero.prepend(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0.1, 400);
camera.position.copy(new THREE.Vector3(1, 1.25, 1).normalize()).multiplyScalar(90);
camera.lookAt(0, 0, 0);

const hemi = new THREE.HemisphereLight(); scene.add(hemi);
const sun = new THREE.DirectionalLight();
sun.position.set(-8, 26, 16);
sun.castShadow = true;
sun.shadow.mapSize.set(1024, 1024);
Object.assign(sun.shadow.camera, { left: -14, right: 14, top: 14, bottom: -14, near: 1, far: 90 });
sun.shadow.bias = -0.0015;
scene.add(sun);

let theme = THEMES.light;
const mats = {};
const mat = (role) => (mats[role] ??= new THREE.MeshLambertMaterial({ color: COLORS[role], flatShading: true }));
const GEO = { box: new THREE.BoxGeometry(1, 1, 1), ico: new THREE.IcosahedronGeometry(1, 0) };
const cylGeo = {};
const cylinder = (rt, rb, seg) => (cylGeo[`${rt}|${rb}|${seg}`] ??= new THREE.CylinderGeometry(rt, rb, 1, seg));

function mesh(parent, geo, material, sx, sy, sz, x, y, z) {
  const m = new THREE.Mesh(geo, material);
  m.scale.set(sx, sy, sz); m.position.set(x, y, z);
  m.castShadow = true; m.receiveShadow = true;
  parent.add(m); return m;
}
/** 箱。y は底の高さ。 */
const box = (p, role, w, h, d, x, y, z, material) => mesh(p, GEO.box, material ?? mat(role), w, h, d, x, y + h / 2, z);
/** 円柱。y は底の高さ。 */
const cyl = (p, role, r, h, x, y, z, seg = 10, rb = r) => mesh(p, cylinder(1, rb / r, seg), mat(role), r, h, r, x, y + h / 2, z);
/** 葉の塊（角ばった球）。y は中心。 */
const ico = (p, role, sx, sy, sz, x, y, z) => mesh(p, GEO.ico, mat(role), sx, sy, sz, x, y, z);

function canvasTexture(w, h, draw, repeat) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 4;
  if (repeat) { t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(repeat[0], repeat[1]); }
  return t;
}

// ============================================================
// 部屋の配置（奥の 2 面が壁。手前は開けたまま床が続く）
//   左奥の壁 x = -7.5（窓・本棚・書類棚）、右奥の壁 z = -7.5（ホワイトボード・給湯・仮眠室）
//   デスクの島は左、仮眠室は右奥（ガラスの仕切り）、ラウンジは右手前
// ============================================================
const room = new THREE.Group(); scene.add(room);   // 動かない物。あとで材質ごとに 1 つにまとめる
const WALL_X = -7.5, WALL_Z = -7.5;
const NAP = { x0: 1.2, z1: -0.6 };                 // 仮眠室: x > 1.2、z < -0.6
const DOOR = { x: 2.1 };                           // 仮眠室の出入口（手前の仕切り）
const AISLE = { napX: 4.0, napZ: -1.3, frontZ: 0.3, officeX: 0.6 };

// --- 床
const woodTex = canvasTexture(256, 256, (g, w, h) => {
  const r = rng(7), rows = 8, ph = h / rows;
  for (let i = 0; i < rows; i++) {
    let x = -r() * 120;
    while (x < w) {
      const len = 90 + r() * 110, tone = 190 + r() * 26;
      g.fillStyle = `rgb(${tone},${tone * 0.8 | 0},${tone * 0.6 | 0})`;
      g.fillRect(x, i * ph, len, ph);
      g.fillStyle = 'rgba(80,50,25,.10)';
      for (let k = 0; k < 3; k++) g.fillRect(x, i * ph + r() * ph, len, 1);
      g.fillStyle = 'rgba(70,45,25,.35)'; g.fillRect(x + len - 1, i * ph, 1.5, ph);
      x += len;
    }
    g.fillStyle = 'rgba(70,45,25,.32)'; g.fillRect(0, i * ph, w, 1.5);
  }
}, [52, 52]);
const floor = new THREE.Mesh(new THREE.PlaneGeometry(170, 170), new THREE.MeshLambertMaterial({ map: woodTex }));
floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor);

function rug(w, d, x, z, material) {
  const m = new THREE.Mesh(new THREE.PlaneGeometry(w, d), material);
  m.rotation.x = -Math.PI / 2; m.position.set(x, 0.012, z); m.receiveShadow = true; scene.add(m); return m;
}
// デスクの島の下はタイルカーペット
rug(6.2, 7.0, -3.6, 2.7, new THREE.MeshLambertMaterial({ map: canvasTexture(128, 128, (g) => {
  for (let i = 0; i < 2; i++) for (let j = 0; j < 2; j++) {
    g.fillStyle = (i + j) % 2 ? '#8c96a5' : '#848e9d'; g.fillRect(i * 64, j * 64, 64, 64);
    g.strokeStyle = 'rgba(0,0,0,.08)';
    for (let k = 0; k < 64; k += 6) { g.beginPath(); if ((i + j) % 2) { g.moveTo(i * 64 + k, j * 64); g.lineTo(i * 64 + k, j * 64 + 64); } else { g.moveTo(i * 64, j * 64 + k); g.lineTo(i * 64 + 64, j * 64 + k); } g.stroke(); }
  }
}, [3.5, 3.5]) }));
// 仮眠室とラウンジのラグ
rug(5.6, 6.2, 4.35, -4.0, new THREE.MeshLambertMaterial({ map: canvasTexture(128, 128, (g) => {
  g.fillStyle = '#cfc2d8'; g.fillRect(0, 0, 128, 128);
  g.strokeStyle = '#b6a7c3'; g.lineWidth = 6; g.strokeRect(8, 8, 112, 112);
}) }));
rug(3.8, 2.8, 4.8, 3.0, new THREE.MeshLambertMaterial({ map: canvasTexture(128, 96, (g) => {
  g.fillStyle = '#d9cbb5'; g.fillRect(0, 0, 128, 96);
  g.fillStyle = '#c9b89d'; for (let i = 0; i < 128; i += 16) g.fillRect(i, 0, 8, 96);
  g.strokeStyle = '#b8a385'; g.lineWidth = 5; g.strokeRect(4, 4, 120, 88);
}) }));

// --- 壁（手前へ長く伸ばし、枠の端で切れ目を見せない）
box(room, 'wall', 0.3, 8, 60, WALL_X - 0.15, 0, 22.5);
box(room, 'wall', 60, 8, 0.3, 22.5, 0, WALL_Z - 0.15);
box(room, 'baseboard', 0.05, 0.12, 60, WALL_X + 0.02, 0, 22.5);
box(room, 'baseboard', 60, 0.12, 0.05, 22.5, 0, WALL_Z + 0.02);
box(room, 'beam', 0.14, 0.16, 60, WALL_X + 0.07, 3.1, 22.5);
box(room, 'beam', 60, 0.16, 0.14, 22.5, 3.1, WALL_Z + 0.07);

// --- 窓（左奥の壁。外はライトで昼の空、ダークで夜の街）
const windowMat = new THREE.MeshBasicMaterial();
function windowTexture(night) {
  return canvasTexture(256, 160, (g, w, h) => {
    const sky = g.createLinearGradient(0, 0, 0, h);
    if (night) { sky.addColorStop(0, '#0d1630'); sky.addColorStop(1, '#2a3d66'); }
    else { sky.addColorStop(0, '#8fc6ee'); sky.addColorStop(1, '#e2f1fb'); }
    g.fillStyle = sky; g.fillRect(0, 0, w, h);
    const r = rng(3);
    let x = 0;
    while (x < w) {
      const bw = 18 + r() * 34, bh = 40 + r() * 90;
      g.fillStyle = night ? '#161f36' : '#c4d3e0'; g.fillRect(x, h - bh, bw, bh);
      for (let yy = h - bh + 6; yy < h - 4; yy += 9) for (let xx = x + 4; xx < x + bw - 4; xx += 7) {
        if (night ? r() < 0.28 : r() < 0.5) { g.fillStyle = night ? '#ffd98a' : '#aebfcf'; g.fillRect(xx, yy, 3, 4); }
      }
      x += bw + 2;
    }
  });
}
function windowOnWallX(zc) {
  const w = 2.5, y0 = 0.95, h = 1.7, x = WALL_X;
  box(room, null, 0.02, h - 0.1, w - 0.1, x + 0.01, y0 + 0.05, zc, windowMat);
  for (const dz of [-w / 2, w / 2]) box(room, 'windowFrame', 0.08, h, 0.07, x + 0.04, y0, zc + dz);
  for (const yy of [y0, y0 + h - 0.07]) box(room, 'windowFrame', 0.08, 0.07, w, x + 0.04, yy, zc);
  box(room, 'windowFrame', 0.06, h, 0.04, x + 0.04, y0, zc);
  box(room, 'windowFrame', 0.06, 0.04, w, x + 0.04, y0 + h * 0.62, zc);
  box(room, 'sill', 0.2, 0.05, w + 0.2, x + 0.1, y0 - 0.05, zc);
}
windowOnWallX(-0.1); windowOnWallX(2.9);

// --- 植物
function fiddleLeaf(x, z, s = 1, seed = 1) {
  const r = rng(seed), g = new THREE.Group(); g.position.set(x, 0, z); g.scale.setScalar(s); room.add(g);
  cyl(g, 'potWhite', 0.24, 0.42, 0, 0, 0, 10, 0.19); cyl(g, 'soil', 0.21, 0.02, 0, 0.41, 0);
  box(g, 'trunk', 0.05, 1.5, 0.05, 0, 0.42, 0);
  for (let i = 0; i < 14; i++) {
    const a = r() * Math.PI * 2, y = 0.95 + r() * 0.95, d = 0.12 + r() * 0.2;
    const l = ico(g, ['leaf', 'leaf2', 'leaf3'][i % 3], 0.19, 0.06, 0.13, Math.cos(a) * d, y, Math.sin(a) * d);
    l.rotation.set(r() * 0.8 - 0.4, a, r() * 0.9 - 0.45);
  }
}
function snakePlant(x, z, s = 1, seed = 2) {
  const r = rng(seed), g = new THREE.Group(); g.position.set(x, 0, z); g.scale.setScalar(s); room.add(g);
  box(g, 'potDark', 0.36, 0.38, 0.36, 0, 0, 0); box(g, 'soil', 0.3, 0.02, 0.3, 0, 0.37, 0);
  for (let i = 0; i < 9; i++) {
    const h = 0.55 + r() * 0.55, b = box(g, i % 2 ? 'leaf4' : 'leaf2', 0.07, h, 0.025, (r() - 0.5) * 0.18, 0.38, (r() - 0.5) * 0.18);
    b.rotation.set((r() - 0.5) * 0.35, r() * Math.PI, (r() - 0.5) * 0.35);
  }
}
function monstera(x, z, s = 1, seed = 3) {
  const r = rng(seed), g = new THREE.Group(); g.position.set(x, 0, z); g.scale.setScalar(s); room.add(g);
  cyl(g, 'potTerra', 0.26, 0.4, 0, 0, 0, 10, 0.2); cyl(g, 'soil', 0.23, 0.02, 0, 0.39, 0);
  for (let i = 0; i < 9; i++) {
    const a = (i / 9) * Math.PI * 2 + r() * 0.4, d = 0.25 + r() * 0.2, y = 0.6 + r() * 0.55;
    const stem = box(g, 'leaf2', 0.025, y - 0.35, 0.025, Math.cos(a) * d * 0.5, 0.38, Math.sin(a) * d * 0.5);
    stem.rotation.set(Math.sin(a) * 0.4, 0, -Math.cos(a) * 0.4);
    const l = ico(g, i % 2 ? 'leaf' : 'leaf4', 0.26, 0.045, 0.2, Math.cos(a) * d, y, Math.sin(a) * d);
    l.rotation.set(0, -a, 0.35);
  }
}
function succulent(p, x, y, z, seed = 4) {
  const r = rng(seed);
  cyl(p, 'potWhite', 0.06, 0.08, x, y, z, 8, 0.05);
  for (let i = 0; i < 4; i++) ico(p, i % 2 ? 'leaf3' : 'leaf', 0.04, 0.05, 0.04, x + (r() - 0.5) * 0.06, y + 0.11, z + (r() - 0.5) * 0.06);
}

// --- 本棚・書類棚（左奥の壁）
function bookshelf(zc, seed) {
  const r = rng(seed), x = WALL_X + 0.22, w = 1.8, d = 0.4, h = 2.0;
  for (const dz of [-w / 2, w / 2]) box(room, 'shelf', d, h, 0.05, x, 0, zc + dz);
  box(room, 'shelf', 0.03, h, w, WALL_X + 0.03, 0, zc);
  const levels = [0.02, 0.5, 1.0, 1.5];
  for (const y of [...levels, 1.96]) box(room, 'shelf', d, 0.04, w, x, y, zc);
  levels.forEach((y, li) => {
    let z = zc - w / 2 + 0.06;
    while (z < zc + w / 2 - 0.12) {
      if (r() < 0.12) { z += 0.15; continue; }
      const bw = 0.05 + r() * 0.06, bh = 0.26 + r() * 0.16;
      if (r() < 0.1 && li > 0) {           // 平積み
        for (let k = 0; k < 3; k++) box(room, `book${1 + ((k + li) % 6)}`, 0.26, 0.05, 0.3, x, y + 0.04 + k * 0.05, z + 0.15);
        z += 0.34; continue;
      }
      box(room, `book${1 + Math.floor(r() * 6)}`, 0.28, bh, bw, x + 0.02, y + 0.04, z + bw / 2);
      z += bw + 0.008;
    }
  });
  // 上にポトス
  cyl(room, 'potWhite', 0.1, 0.14, x, 2.0, zc + 0.55, 8);
  for (let i = 0; i < 6; i++) ico(room, i % 2 ? 'leaf3' : 'leaf', 0.08, 0.05, 0.08, x + 0.05 + (r() - 0.3) * 0.12, 2.14 - i * 0.12, zc + 0.5 + (r() - 0.5) * 0.25);
}
bookshelf(-4.6, 11);
function fileCabinet(zc) {
  const x = WALL_X + 0.27;
  box(room, 'cabinet', 0.5, 1.05, 0.5, x, 0, zc);
  for (let i = 1; i < 3; i++) box(room, 'handle', 0.01, 0.01, 0.48, x + 0.255, i * 0.35, zc);
  for (let i = 0; i < 3; i++) box(room, 'handle', 0.02, 0.03, 0.14, x + 0.26, 0.22 + i * 0.35, zc);

// 動かない物を材質ごとに 1 つのメッシュへ（描く回数を数百 → 数十に）
function mergeStatic(group) {
  group.updateMatrixWorld(true);
  const buckets = new Map();
  group.traverse((o) => {
    if (!o.isMesh) return;
    let gg = o.geometry.clone().applyMatrix4(o.matrixWorld);
    if (gg.index) gg = gg.toNonIndexed();
    if (!buckets.has(o.material)) buckets.set(o.material, []);
    buckets.get(o.material).push(gg);
  });
  scene.remove(group);
  for (const [m, list] of buckets) {
    const merged = mergeGeometries(list);
    if (!merged) continue;
    const mm = new THREE.Mesh(merged, m);
    mm.castShadow = !m.transparent; mm.receiveShadow = true;
    scene.add(mm);
  }
}

const people = new Map();

function routeBedToDesk(slot) {
  const b = beds[slot].stand, d = desks[slot].stand;
  return [b.clone(), V(AISLE.napX, AISLE.napZ), V(DOOR.x, AISLE.napZ), V(DOOR.x, AISLE.frontZ), V(AISLE.officeX, d.z), d.clone()];

function placeAt(p, place) {
  const c = p.c;
  // 姿勢を先に決めてから置く（姿勢を戻すときに高さを 0 に戻すので、逆だとベッドの中に沈む）
  if (place === 'desk') { poseSit(c); c.root.position.copy(desks[p.slot].seat); c.root.rotation.y = 0; }
  else { poseLie(c); c.root.position.copy(beds[p.slot].lie); c.root.rotation.y = Math.PI; }
  p.place = place; p.walk = null; refreshFurniture();
}
function walkTo(p, place) {
  if (p.walk) {           // 途中で向きが変わった: 来た道を戻る
    const back = [p.c.root.position.clone().setY(0), ...p.walk.points.slice(0, p.walk.i).reverse()];
    p.walk = { points: back, i: 1, target: place, phase: p.walk.phase };
  } else {
    const route = routeBedToDesk(p.slot);
    if (place === 'bed') route.reverse();
    poseStand(p.c); p.c.root.position.copy(route[0]);
    p.walk = { points: route, i: 1, target: place, phase: 0 };
  }
  p.place = 'walking'; refreshFurniture();
}
function refreshFurniture() {
  desks.forEach((d) => (d.on = false)); beds.forEach((b) => (b.used = false));
  for (const p of people.values()) { if (p.place === 'desk') desks[p.slot].on = true; if (p.place === 'bed') beds[p.slot].used = true; }
  desks.forEach((d) => { d.screen.material.color.set(d.on ? theme.screenOn : theme.screenOff); d.glow.intensity = d.on && theme.night ? d.glow.userData.on : 0; });
  beds.forEach((b) => { b.blanket.position.y = b.used ? 0.7 : 0.49; b.blanket.scale.y = b.used ? 0.12 : 0.06; });
  dirty = true;
}

  list.forEach((agent, index) => {
    seen.add(agent.id);
    const preset = (Number.isInteger(agent.preset) ? agent.preset : hashId(agent.id)) % PRESETS.length;
    let p = people.get(agent.id);
    if (p && p.c.presetIndex !== preset) { disposeCharacter(p.c); people.delete(agent.id); p = null; }
    if (!p) { p = { c: makeCharacter(preset), agent, slot: index, place: null, walk: null }; people.set(agent.id, p); }
    const slotChanged = p.slot !== index;
    p.agent = agent; p.slot = index;
    const want = agent.working ? 'desk' : 'bed', current = p.walk ? p.walk.target : p.place;
    if (firstSet || reduced || p.place === null || slotChanged) placeAt(p, want);
    else if (current !== want) walkTo(p, want);
  });
  for (const [id, p] of people) if (!seen.has(id)) { disposeCharacter(p.c); people.delete(id); }
  firstSet = false; refreshFurniture();
}
function setTheme({ dark = false, accent } = {}) {
  theme = { ...(dark ? THEMES.dark : THEMES.light) }; if (accent) theme.accent = accent;
  document.body.classList.toggle('dark', dark);
  scene.background = new THREE.Color(theme.bg);
  hemi.color.set(theme.hemiSky); hemi.groundColor.set(theme.hemiGround); hemi.intensity = theme.hemi;
  sun.intensity = theme.sun; sun.color.set(theme.sunColor);
  windowMat.map?.dispose(); windowMat.map = windowTexture(theme.night); windowMat.needsUpdate = true;
  mat('lampShade').emissive.set(theme.night ? '#ffb45c' : '#000000'); mat('lampShade').emissiveIntensity = 0.8;
  nightLights.forEach((l) => (l.intensity = theme.night ? l.userData.on : 0));   // 消さずに 0 にする（数を変えると描き直しの準備で引っかかる）
  for (const p of people.values()) { scene.remove(p.c.zzz, p.c.badge); p.c.zzz = zzzSprite(); p.c.badge = badgeSprite(); scene.add(p.c.zzz, p.c.badge); }
  refreshFurniture();
}

// ============================================================
// 毎コマ
// ============================================================
const tmp = new THREE.Vector3();
function update(dt, t) {
  for (const p of people.values()) {
    const c = p.c;
    if (p.walk) {
      const w = p.walk, target = w.points[w.i];
      tmp.subVectors(target, c.root.position); tmp.y = 0;
      const dist = tmp.length(), step = WALK_SPEED * dt;
      if (dist <= step || reduced) {
        c.root.position.set(target.x, 0, target.z);
        if (++w.i >= w.points.length || reduced) { placeAt(p, w.target); continue; }
      } else {
        tmp.multiplyScalar(1 / dist);
        c.root.position.addScaledVector(tmp, step);
        c.root.rotation.y = Math.atan2(-tmp.x, -tmp.z);
        w.phase += dt * 9;
        const s = Math.sin(w.phase) * 0.6;
        c.legs[0].rotation.x = s; c.legs[1].rotation.x = -s; c.arms[0].rotation.x = -s; c.arms[1].rotation.x = s;
        c.root.position.y = Math.abs(Math.sin(w.phase)) * 0.04;
      }
    } else if (!reduced && p.place === 'desk') {
      const k = t * 14 + p.slot;
      c.arms[0].rotation.x = 1.15 + Math.sin(k) * 0.12; c.arms[1].rotation.x = 1.15 + Math.sin(k + 1.7) * 0.12;
      c.head.rotation.y = Math.sin(t * 0.7 + p.slot) * 0.12;
    } else if (!reduced && p.place === 'bed') {
      c.body.scale.y = 1 + Math.sin(t * 2 + p.slot) * 0.015;
    }
    c.head.getWorldPosition(tmp);
    const sleeping = p.place === 'bed';
    c.zzz.visible = sleeping;
    if (sleeping) {
      const cyc = reduced ? 0.4 : ((t * 0.45 + p.slot * 0.13) % 1);
      c.zzz.position.set(tmp.x + 0.4, tmp.y + 0.5 + cyc * 0.45, tmp.z);
      c.zzz.material.opacity = reduced ? 1 : Math.min(1, (1 - cyc) * 1.6);
    }
    c.badge.visible = !!p.agent.unread;
    if (c.badge.visible) c.badge.position.set(tmp.x - (sleeping ? 0.4 : 0), tmp.y + (sleeping ? 0.45 : 0.75) + (reduced ? 0 : Math.sin(t * 3) * 0.03), tmp.z);
  }
}
const anyWalking = () => { for (const p of people.values()) if (p.walk) return true; return false; };
function frame(now) {
  requestAnimationFrame(frame);
  if (paused || document.hidden) return;
  const animating = anyWalking() || (!reduced && people.size > 0);
  if (!animating && !dirty) return;
  // 画面の更新（120Hz なら 8.3ms ごと）と少しずれても取りこぼさないよう、1.5ms の余裕を見る
  if (!dirty && FPS && now - lastTime < 1000 / FPS - 1.5) return;
  const dt = Math.min(0.1, (now - lastTime) / 1000 || 0);
  lastTime = now; update(dt, now / 1000);
  renderer.render(scene, camera); dirty = false;
  fpsCount++;
}
let fpsCount = 0;
setInterval(() => { const el = document.getElementById('fpsV'); if (el) el.textContent = `${fpsCount} fps`; fpsCount = 0; }, 1000);

// ============================================================
// 枠に合わせる（部屋が収まる大きさに寄せる。外側は壁と床で埋まる）
// ============================================================
let zoom = 0.88;
const focus = [];
for (const x of [-7.5, 7.3]) for (const z of [-7.5, 6.2]) for (const y of [0, 2.2]) focus.push(new THREE.Vector3(x, y, z));
function layout() {
  const w = hero.clientWidth, h = hero.clientHeight;
  if (!w || !h) return;
  renderer.setSize(w, h, false);
  camera.updateMatrixWorld();
  let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
  for (const v of focus) { tmp.copy(v).applyMatrix4(camera.matrixWorldInverse); minX = Math.min(minX, tmp.x); maxX = Math.max(maxX, tmp.x); minY = Math.min(minY, tmp.y); maxY = Math.max(maxY, tmp.y); }
  const aspect = w / h, cx = (minX + maxX) / 2, cy = (minY + maxY) / 2;
  const halfW = Math.max((maxX - minX) / 2, ((maxY - minY) / 2) * aspect) * zoom, halfH = halfW / aspect;
  Object.assign(camera, { left: cx - halfW, right: cx + halfW, top: cy + halfH, bottom: cy - halfH });
  camera.updateProjectionMatrix(); dirty = true;
}
new ResizeObserver(layout).observe(hero);

// アプリ（WebView）から呼ぶ口
window.office = {
  setAgents, setTheme,
  setReducedMotion(v) { reduced = !!v; setAgents([...people.values()].sort((a, b) => a.slot - b.slot).map((p) => p.agent)); },
  setPaused(v) { paused = !!v; dirty = true; },
};

// ============================================================
// プレビューだけの操作盤
// ============================================================
const embed = new URLSearchParams(location.search).has('embed');
document.body.classList.toggle('embed', embed);
const NAMES = ['Moonshot', 'Wordsmith', 'CJ', 'Scout'];
let demo = [
  { id: 'a1', name: 'Moonshot', working: true, unread: false },
  { id: 'a2', name: 'Wordsmith', working: false, unread: true },
  { id: 'a3', name: 'CJ', working: true, unread: false },
  { id: 'a4', name: 'Scout', working: false, unread: false },
];
function renderPanel() {
  const root = document.getElementById('agents'); root.innerHTML = '';
  demo.forEach((a) => {
    const row = document.createElement('div'); row.className = 'row';
    const name = document.createElement('span'); name.className = 'name'; name.textContent = a.name;
    const state = document.createElement('button'); state.textContent = a.working ? '作業中' : '睡眠'; state.className = a.working ? 'on' : '';
    state.onclick = () => { a.working = !a.working; push(); };
    const unread = document.createElement('label'); unread.innerHTML = `<input type="checkbox" ${a.unread ? 'checked' : ''}> 未読`;
    unread.querySelector('input').onchange = (e) => { a.unread = e.target.checked; push(); };
    const sel = document.createElement('select');
    PRESETS.forEach((_, k) => { const o = document.createElement('option'); o.value = k; o.textContent = `キャラ ${k + 1}`; sel.append(o); });
    sel.value = String((Number.isInteger(a.preset) ? a.preset : hashId(a.id)) % PRESETS.length);
    sel.onchange = () => { a.preset = Number(sel.value); push(); };
    row.append(name, state, unread, sel); root.append(row);
  });
}
function push() { setAgents(demo.map((a) => ({ ...a }))); renderPanel(); }
document.getElementById('add').onclick = () => { const n = demo.length; if (n >= SEATS) return; demo.push({ id: `a${n + 1}`, name: NAMES[n], working: false, unread: false }); push(); };
document.getElementById('remove').onclick = () => { demo.pop(); push(); };
const sysDark = matchMedia('(prefers-color-scheme: dark)');
document.getElementById('dark').onchange = (e) => setTheme({ dark: e.target.checked });
document.getElementById('fps').onchange = (e) => { FPS = Number(e.target.value); };
document.getElementById('reduced').onchange = (e) => window.office.setReducedMotion(e.target.checked);
document.getElementById('height').oninput = (e) => { hero.style.height = e.target.value + 'px'; document.getElementById('heightV').textContent = e.target.value + 'px'; };
document.getElementById('zoom').oninput = (e) => { zoom = e.target.value / 100; document.getElementById('zoomV').textContent = zoom.toFixed(2); layout(); };
// システムの外観に連動（アプリでは、アプリのテーマから setTheme で渡す）
sysDark.addEventListener('change', (e) => { setTheme({ dark: e.matches }); document.getElementById('dark').checked = e.matches; });
setTheme({ dark: sysDark.matches });
document.getElementById('dark').checked = sysDark.matches;
layout();
if (!embed) push();
requestAnimationFrame(frame);
</script>
</body>
